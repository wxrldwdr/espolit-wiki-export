<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#060a0c">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Редактор — Surwave Wiki</title>
  <link rel="stylesheet" href="editor.css?v=20260812-2040">
  <link rel="stylesheet" href="editor-v2.css?v=20260812-2040">
  <link rel="stylesheet" href="editor-v2-sizing.css?v=20260812-2040">
  <link rel="stylesheet" href="editor-v2-cards.css?v=20260812-2040">
  <link rel="stylesheet" href="editor-v2-gradient-states.css?v=20260812-2040">
  <link rel="stylesheet" href="editor-v3-workspace.css?v=20260812-2040">
  <link rel="stylesheet" href="editor-v5-archive.css?v=20260812-2040">
  <link rel="stylesheet" href="editor-v6-block-tools.css?v=20260812-2132">
</head>
<body>
  <header class="editor-topbar">
    <a class="editor-brand" href="/surwave-site/wiki/index.html" target="_blank" rel="noopener">
      <img src="/surwave-site/assets/logos/surwave-wiki-logo.svg" alt="Surwave Wiki">
      <span>Редактор</span>
    </a>
    <div class="top-actions">
      <button id="newPage" class="btn">Новая страница</button>
      <button id="duplicatePage" class="btn">Дублировать</button>
      <button id="savePage" class="btn primary">Сохранить</button>
      <button id="downloadMd" class="btn">Скачать .md</button>
      <button id="downloadHtml" class="btn">Автономный HTML</button>
      <button id="openWiki" class="btn">Открыть страницу ↗</button>
      <button id="deletePage" class="btn danger">Удалить</button>
    </div>
  </header>

  <div class="editor-shell">
    <aside class="library-panel">
      <div class="panel-title">Страницы</div>
      <input id="pageSearch" class="field" type="search" placeholder="Поиск страницы…" autocomplete="off">
      <div id="pageList" class="page-list"></div>
    </aside>

    <main class="workspace">
      <section class="page-meta card">
        <div class="meta-row title-row">
          <label>Название страницы
            <input id="pageTitle" class="field" type="text" placeholder="Название">
          </label>
          <label>Раздел
            <select id="pageGroup" class="field"></select>
          </label>
          <label>Файл страницы
            <input id="pagePath" class="field mono" type="text" placeholder="pages/nazvanie.md">
          </label>
        </div>
        <div class="meta-help">Файл задаёт адрес страницы. Например <code>obshee/fermy.md</code> → <code>/wiki/obshee/fermy.html</code>.</div>
      </section>

      <div class="mobile-tabs">
        <button class="active" data-view="blocks">Редактор</button>
        <button data-view="preview">Предпросмотр</button>
      </div>

      <section class="composer card" id="composerPanel">
        <div class="composer-head">
          <div>
            <h1>Содержимое</h1>
            <p>Клик по блоку предпросмотра переносит к соответствующему блоку редактора.</p>
          </div>
          <div id="mainAddBar"></div>
        </div>
        <div id="blocks" class="blocks"></div>
        <div id="bottomAddBar"></div>
      </section>
    </main>

    <aside class="preview-panel" id="previewPanel">
      <div class="preview-head">
        <span>Живой предпросмотр · кликни по блоку для перехода</span>
        <span id="saveState" class="save-state">Готово</span>
      </div>
      <iframe id="preview" title="Предпросмотр страницы"></iframe>
    </aside>
  </div>

  <input id="mediaPicker" type="file" accept="image/png,image/jpeg,image/gif,image/apng,image/webp,image/svg+xml,video/mp4,video/webm" hidden>
  <div id="toast" class="toast" role="status"></div>

  <script src="editor-v2-core.js?v=20260812-2040"></script>
  <script src="editor-v2-cards-register.js?v=20260812-2040"></script>
  <script src="editor-v2-cards-core.js?v=20260812-2040"></script>
  <script src="editor-v2-cards-fidelity.js?v=20260812-2040"></script>
  <script src="editor-v2-gradient-states-core.js?v=20260812-2040"></script>
  <script src="editor-v2-sizing.js?v=20260812-2040"></script>
  <script src="editor-v2-sizing-runtime.js?v=20260812-2040"></script>
  <script src="editor-v2-compat.js?v=20260812-2040"></script>
  <script src="editor-v2-gradient-persist.js?v=20260812-2040"></script>
  <script src="editor-v7-link-wrapper-cleanup.js?v=20260812-2040"></script>
  <script src="/surwave-site/assets/js/gradient-runtime.js?v=20260812-2040"></script>
  <script src="/surwave-site/assets/js/ip-shade-runtime.js?v=20260812-2040"></script>
  <script src="editor-v2-ip-frame-fix.js?v=20260812-2040"></script>
  <script src="editor-v4-live-preview.js?v=20260812-2040"></script>
  <script src="editor-v2.js?v=20260812-2040"></script>
  <script src="editor-v10-rich-selection.js?v=20260812-2133"></script>
  <script src="editor-v2-cards-ui.js?v=20260812-2040"></script>
  <script src="editor-v2-gradient-states-ui.js?v=20260812-2040"></script>
  <script src="editor-v2-gradient-preview.js?v=20260812-2040"></script>
  <script src="editor-v8-ip-preview-sync.js?v=20260812-2040"></script>
  <script src="editor-v3-workspace.js?v=20260812-2040"></script>
  <script src="editor-v5-archive.js?v=20260812-2040"></script>
  <script src="editor-v9-page-organizer.js?v=20260812-2040"></script>
  <script src="editor-v6-block-tools.js?v=20260812-2132"></script>
  <script>
    setTimeout(() => {
      const core=window.SurwaveEditorCoreV2;
      const loaded=!!core&&core.TYPES.some(([type])=>type==='servercards');
      const gradients=!!window.SurwaveEnsureGradientStates;
      const runtime=!!window.SurwaveGradientRuntime;
      const persistence=!!window.SurwaveGradientPersistence;
      if(loaded&&gradients&&runtime&&persistence)return;
      const toast=document.getElementById('toast');if(!toast)return;
      toast.textContent='Ошибка: один из модулей IP-карточек/градиентов не загрузился. Перезапусти START_EDITOR.bat.';
      toast.classList.add('visible');console.error('Surwave editor module check:',{loaded,gradients,runtime,persistence});
    },700);
  </script>
</body>
</html>
